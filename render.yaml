# ==============================================================================
# Render Infrastructure Blueprint - Smart Rain Alert System
# 100% FREE Services Only (No paid plans or paid persistent disks)
# ==============================================================================

databases:
  # Render Free Managed PostgreSQL Database
  # Note: Render Free PostgreSQL is valid for 30 days (fully covers the 1-week requirement)
  - name: smart-rain-db
    databaseName: smart_rain_db
    user: smart_rain_user
    plan: free
    region: oregon

services:
  # Render Free Web Service - FastAPI Backend
  - type: web
    name: smart-rain-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smart-rain-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://smart-rain-dashboard.onrender.com

  # Render Free Static Site - React Vite Dashboard
  - type: web
    name: smart-rain-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: smart-rain-backend
          type: web
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
